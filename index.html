<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فاکتور</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
:root{
  --blue:#1769e0; --pink:#ed1670; --green:#20a94b; --orange:#ff8a00;
  --purple:#7040c7; --red:#e22b25; --ink:#18213a; --cream:#fffdf6;
}
body{
  margin:0; font-family:Tahoma,"Vazirmatn","Noto Naskh Arabic",sans-serif;
  background:linear-gradient(135deg,#eef6ff,#fff4fb 45%,#f4fff4);
  color:var(--ink); padding:12px;
}
button,input,select{font:inherit}
.app{max-width:760px;margin:auto}
.top{
  background:linear-gradient(135deg,#fff,#fff9ef);
  border:3px solid #1c9b66;border-radius:26px;padding:16px 14px 14px;
  box-shadow:0 8px 28px #00000018; margin-bottom:12px; position:relative; overflow:hidden;
}
.top:before,.top:after{content:"🌸";position:absolute;font-size:45px;opacity:.75;top:8px}
.top:before{left:10px}.top:after{right:10px}

/* تقويم التاريخ */
.date-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 6px; position: relative; z-index: 5; }
.date-btn-wrapper {
  position: relative; width: 40px; height: 40px; background: #eef5ff; border: 2px solid #c8d8f0;
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 8px #0001; transition: 0.2s;
}
.date-btn-wrapper:active { transform: scale(0.92); }
.calendar-icon { font-size: 22px; pointer-events: none; }
#dateInput { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.page-date { color:#18213a; font-size:26px; font-weight:1000; direction:ltr; margin:0; }

h1{text-align:center;color:#d92323;font-size:44px;margin:5px 0 2px;text-shadow:2px 2px #ffd8d8;font-weight:1000; position:relative; z-index:5;}
.invoice-code{text-align:center;color:#7040c7;font-size:24px;font-weight:1000;margin:0 0 3px; position:relative; z-index:5;}

.notes-box{margin-top:12px}
textarea{width:100%;border:2px solid #dbe5f4;border-radius:12px;padding:12px 10px;background:#fff;outline:none;color:#17213a;resize:vertical;font-family:inherit;font-size:16px; font-weight:700;}
textarea:focus{border-color:#4d8df7;box-shadow:0 0 0 3px #4d8df71b}

/* جدول التطبيق */
.panel{ background:#ffffffec;border:2px solid #d8e5ff;border-radius:20px; padding:16px;box-shadow:0 6px 20px #00000012;margin-bottom:12px }
.form-grid{display:grid;grid-template-columns:1.4fr .8fr .75fr 1fr;gap:10px}
label{font-size:13px;font-weight:900;color:#4a5670;margin:0 0 6px;display:block}
input,select{ width:100%;border:2px solid #dbe5f4;border-radius:12px;padding:12px 10px; background:#fff;outline:none;color:#17213a; font-size:16px; font-weight:700; }
input:focus,select:focus{border-color:#4d8df7;box-shadow:0 0 0 3px #4d8df71b}

.btn{ border:0;border-radius:13px;padding:12px 14px;font-weight:900;font-size:16px;cursor:pointer; box-shadow:0 4px 10px #00000018; transition:.12s transform,.12s filter }
.btn:active{transform:scale(.95)}
.add{background:linear-gradient(135deg,#18a34a,#07883b);color:white;width:100%;margin-top:12px; font-size:18px;}
.save{background:linear-gradient(135deg,#e92828,#ba1111);color:white;flex:1}
.image{background:linear-gradient(135deg,#1769e0,#0b4fb7);color:white;flex:1}
.clear{background:#f2f5fa;color:#29334a; border:2px solid #dbe5f4;}
.actions{display:flex;gap:10px;margin-top:14px}
.count{font-weight:900;color:#1a5dc6;font-size:16px; margin-bottom:10px;}

.table-wrap{overflow-x:auto;border-radius:15px;border:1px solid #d8e1ee}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:650px;background:white}
th,td{padding:12px 7px;text-align:center;border-left:1px solid #fff;border-bottom:1px solid #fff;font-weight:800; font-size:16px;}
th{color:#fff;font-size:15px}
th:nth-child(1){background:var(--purple)} th:nth-child(2){background:var(--pink)}
th:nth-child(3){background:var(--green)} th:nth-child(4){background:var(--blue)}
th:nth-child(5){background:var(--orange)} th:nth-child(6){background:#a21caf}
td{background:#f8fbff}
tr:nth-child(even) td{background:#fff3fa}

.num{font-weight:1000; font-size:18px; color:var(--purple);}
.money{direction:ltr;unicode-bidi:plaintext; font-weight:1000; font-size:18px; color:#0b4fb7;}
.edit{background:#1769e0;color:white;padding:8px 10px;border-radius:9px;border:0; cursor:pointer;}
.del{background:#ef3340;color:white;padding:8px 10px;border-radius:9px;border:0;margin-right:6px; cursor:pointer;}

.total{
  margin-top:16px;border:4px solid #e52c20;border-radius:20px;
  background:linear-gradient(135deg,#fff36b,#ffc928);
  padding:18px;text-align:center;box-shadow:0 6px 20px #0002
}
.total small{display:block;color:#8e1710;font-weight:900;font-size:18px}
.total strong{display:block;color:#a40000;font-size:36px; font-weight:1000; margin-top:5px}
.notice{text-align:center;color:#60708d;font-size:13px;margin-top:10px; font-weight:700;}
.empty{text-align:center;padding:30px;color:#77849a;font-weight:700; font-size:16px;}

/* الصورة المصدرة (الفاتورة) - أرقام كبيرة */
.invoice-card{ position:fixed;left:-10000px;top:0;width:900px;background:#fff; }
#capture{ width:900px;padding:26px;background:linear-gradient(135deg,#fffdf6,#f7fbff); border:6px solid #16885b;border-radius:30px;overflow:hidden; }
.capture-title{font-size:52px;text-align:center;color:#d92323;font-weight:1000;margin:3px 0 5px}
.capture-sub{text-align:center;font-size:26px;color:#163f9c;font-weight:900;margin-bottom:20px}
.capture-table{width:96%;margin:0 auto;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.capture-table th{font-size:22px;padding:14px 8px;font-weight:1000}
.capture-table td{font-size:28px;padding:14px 8px;font-weight:1000}
.capture-table td:nth-child(2){font-size:30px;font-weight:1000}
.capture-table td:nth-child(1),.capture-table td:nth-child(3),.capture-table td:nth-child(5),.capture-table td:nth-child(6){font-size:29px;font-weight:1000}

.capture-total{margin-top:20px;border:5px solid #e32b22;border-radius:22px;background:#ffd12b;text-align:center;padding:22px;font-size:34px;font-weight:1000;color:#9d0808}

.capture-footer{margin-top:22px;border:4px solid #16885b;border-radius:20px;overflow:hidden;background:#fff;direction:rtl}
.capture-footer-table{width:100%;border-collapse:collapse;table-layout:fixed}
.capture-footer-table td{border:1px solid #d8e1ee;padding:18px;vertical-align:top;font-size:22px;line-height:1.8}
.capture-footer-table .footer-label{display:block;font-size:18px;font-weight:1000;margin-bottom:8px}
.capture-footer-table .footer-notes{width:60%;text-align:right;background:#fbfdff}
.capture-footer-table .footer-date{width:40%;text-align:left;direction:ltr;background:#f8fff9;font-weight:1000}
.capture-footer-table .footer-date .footer-label{text-align:right;direction:rtl;color:#16885b}
.capture-footer-table .footer-notes .footer-label{color:#1769e0}
.capture-footer-table .footer-date-value{font-size:30px;white-space:nowrap; color:#000;}

.notes-success-sticker{
  display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;
  width:48px;height:48px;margin-right:14px;border-radius:50%;
  background:#20a94b;color:#fff;border:4px solid #fff;
  box-shadow:0 4px 10px #0003;font-size:32px;font-weight:1000;line-height:1;
}

/* إشعار النجاح */
.save-success{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#00000066; backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease;
}
.save-success.show{opacity:1;visibility:visible}
.save-success-check{
  width:130px;height:130px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:#20a94b;color:#fff;border:8px solid #fff;
  box-shadow:0 12px 35px #0006;font-size:90px;font-weight:1000;
  line-height:1;transform:scale(.5);transition:transform .3s cubic-bezier(.2,1.5,.4,1);
}
.save-success.show .save-success-check{transform:scale(1)}
.save-success-text{
  margin-top:20px;padding:12px 24px;border-radius:16px;background:#fff;color:#16885b;
  font-size:24px;font-weight:1000;box-shadow:0 8px 25px #0004;
}
.calendar-open .app,.calendar-open .invoice-card{display:none!important}.calendar-open{overflow:hidden}.persian-calendar{position:fixed;z-index:10000;display:none;top:70px;left:50%;transform:translateX(-50%);width:min(94vw,360px);background:#fff;border:3px solid #1c9b66;border-radius:20px;padding:14px;box-shadow:0 12px 35px #0003;direction:rtl}.persian-calendar.show{display:block}.pc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.pc-head button{border:0;background:#eef5ff;border-radius:10px;padding:8px 12px;font-size:18px;font-weight:900}.pc-title{font-size:20px;font-weight:1000;color:#1769e0}.pc-week,.pc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.pc-week div{font-size:12px;font-weight:900;color:#60708d;padding:5px 0}.pc-days button{border:0;background:#f7faff;border-radius:9px;padding:9px 2px;font-weight:800;font-size:15px}.pc-days button.selected{background:#1c9b66!important;color:#fff!important;box-shadow:0 0 0 3px #1c9b6633;position:relative;outline:2px solid #20a94b}.pc-days button.selected::after{content:'✓';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:13px;line-height:16px;color:#20a94b;background:#fff;border-radius:50%;width:16px;height:16px}.pc-days button.empty{background:transparent}.pc-actions{display:flex;gap:8px;margin-top:10px}.pc-actions button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:900;font-size:15px}.pc-cancel{background:#f2f5fa}.pc-confirm{background:#1c9b66;color:#fff}
@media(max-width:620px){
  body{padding:8px}.top{border-radius:20px}h1{font-size:34px}.invoice-code{font-size:20px}
  .form-grid{grid-template-columns:1fr 1fr} .form-grid .wide{grid-column:1/-1}
  .panel{padding:12px} .actions{flex-wrap:wrap;} .actions .btn{flex: 1 1 40%;}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <!-- أزرار التقويم والتاريخ -->
    <div class="date-container">
      <div class="date-btn-wrapper">
        <span class="calendar-icon">📅</span>
        <input type="text" id="dateInput" title="تغییر تاریخ" readonly onclick="openPersianCalendar()">
      </div>
      <div class="page-date" id="pageDate"></div>
    </div>
    <h1>فاکتور</h1>
    <div class="invoice-code" id="invoiceCode"></div>
  </div>

  <div class="panel">
    <div class="form-grid">
      <div class="wide">
        <label>جنس</label>
        <input id="name" placeholder="">
      </div>
      <div>
        <label>مقدار</label>
        <input id="qty" type="number" min="0" step="0.01" placeholder="">
      </div>
      <div>
        <label>واحد</label>
        <select id="unit">
          <option value="" selected></option><option>کیلو</option><option>پاکت</option><option>بسته</option><option>عدد</option><option>شانه</option>
        </select>
      </div>
      <div>
        <label>قیمت جنس (تومان)</label>
        <input id="price" type="text" inputmode="numeric" autocomplete="off" placeholder="">
      </div>
    </div>
    <button class="btn add" id="addBtn">＋ افزودن جنس به فاکتور</button>
  </div>

  <div class="panel">
    <div class="count" id="count">۰ جنس در فاکتور</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>شماره</th><th>جنس</th><th>مقدار</th><th>واحد</th><th>قیمت واحد (تومان)</th><th>جمع مبلغ (تومان)</th><th>عملیات</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty">هنوز جنسی اضافه نشده است.</div>
    </div>
    <div class="total"><small>جمع مبلغ کل</small><strong id="total">۰ تومان</strong></div>
    <div class="notes-box">
      <label for="notes">توضیحات</label>
      <textarea id="notes" rows="3" placeholder=""></textarea>
    </div>
    <div class="actions">
      <button class="btn save" id="saveBtn">✓ ثبت فاکتور</button>
      <button class="btn image" id="imageBtn">▣ ذخیره عکس</button>
      <button class="btn clear" id="clearBtn">پاک‌کردن</button>
    </div>
    <div class="notice">فاکتور ثبت‌شده در همین گوشی نگهداری می‌شود و می‌توانید تصویر آن را ذخیره کنید.</div>
  </div>
</div>

<div class="invoice-card"><div id="capture"></div></div>

<div id="persianCalendar" class="persian-calendar" aria-hidden="true"><div class="pc-head"><button type="button" onclick="changePersianMonth(-1)">‹</button><div class="pc-title" id="pcTitle"></div><button type="button" onclick="changePersianMonth(1)">›</button></div><div class="pc-week"><div>ش</div><div>ی</div><div>د</div><div>س</div><div>چ</div><div>پ</div><div>ج</div></div><div class="pc-days" id="pcDays"></div><div class="pc-actions"><button type="button" class="pc-cancel" onclick="closePersianCalendar()">انصراف</button><button type="button" class="pc-confirm" onclick="confirmPersianDate()">تأیید تاریخ</button></div></div>

<div id="saveSuccess" class="save-success" aria-hidden="true">
  <div class="save-success-check">✓</div>
  <div class="save-success-text">عکس فاکتور با موفقیت ذخیره شد</div>
</div>

<script>
const $=id=>document.getElementById(id);
let items=[];
let editIndex=-1;
let invoiceCode=generateInvoiceCode();
// تاریخ فاکتور در شروع همیشه از تاریخ فعلی گوشی گرفته می‌شود.
// اگر کاربر از تقویم تاریخ دیگری را انتخاب و تأیید کند، همان تاریخ تا زمان تغییر بعدی استفاده می‌شود.
let invoiceDate=new Date();

function getPhoneToday(){
  const d=new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0, 0);
}

function getJalaliToday(){
  const d=getPhoneToday();
  return gregorianToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
}

function generateInvoiceCode(){
  let code=localStorage.getItem('currentInvoiceCode');
  if(!/^\\d{3}$/.test(String(code||''))) code=String(Math.floor(100+Math.random()*900));
  localStorage.setItem('currentInvoiceCode',code);
  return code;
}
function nextInvoiceCode(){
  const code=String(Math.floor(100+Math.random()*900));
  localStorage.setItem('currentInvoiceCode',code);
  invoiceCode=code;
}

function updateDateDisplay() {
  const faDateText = invoiceDate.toLocaleDateString('fa-IR-u-ca-persian',{
    year:'numeric',month:'2-digit',day:'2-digit'
  });
  $('pageDate').textContent = faDateText;
  $('dateInput').value = faDateText;
}

let pcYear,pcMonth,pcDay;
let pcTempDate=null;
let pcSelectedYear,pcSelectedMonth,pcSelectedDay;
const pMonths=['حمل','ثور','جوزا','سرطان','اسد','سنبله','میزان','عقرب','قوس','جدی','دلو','حوت'];
function openPersianCalendar(){
  // تقویم همیشه سال/ماه فعلی تقویم شمسی گوشی را در اختیار دارد.
  const current=gregorianToJalali(
    invoiceDate.getFullYear(),invoiceDate.getMonth()+1,invoiceDate.getDate()
  );
  [pcYear,pcMonth,pcDay]=current;
  pcSelectedYear=current[0]; pcSelectedMonth=current[1]; pcSelectedDay=current[2];
  pcTempDate=new Date(invoiceDate.getTime());
  document.body.classList.add('calendar-open');
  renderPersianCalendar();
  $('persianCalendar').classList.add('show');
}

function closePersianCalendar(){
  pcTempDate=null;
  document.body.classList.remove('calendar-open');
  $('persianCalendar').classList.remove('show');
}

function confirmPersianDate(){
  if(!pcTempDate) return;
  invoiceDate=new Date(pcTempDate.getTime());
  updateDateDisplay();
  saveDraft();
  render();
  closePersianCalendar();
}

function changePersianMonth(d){
  pcMonth+=d;
  if(pcMonth<1){pcMonth=12;pcYear--}
  if(pcMonth>12){pcMonth=1;pcYear++}
  renderPersianCalendar();
}

function jalaliMonthDays(y,m){
  if(m<=6)return 31;
  if(m<=11)return 30;
  const a=jalaliToGregorian(y,12,1),b=jalaliToGregorian(y+1,1,1);
  return Math.round((b-a)/86400000);
}

function renderPersianCalendar(){
  $('pcTitle').textContent=pMonths[pcMonth-1]+' '+fmt(pcYear);

  const days=jalaliMonthDays(pcYear,pcMonth);
  const f=jalaliToGregorian(pcYear,pcMonth,1);
  const start=(f.getDay()+1)%7;
  const box=$('pcDays');
  box.innerHTML='';

  const selected=pcTempDate
    ? gregorianToJalali(pcTempDate.getFullYear(),pcTempDate.getMonth()+1,pcTempDate.getDate())
    : [pcSelectedYear,pcSelectedMonth,pcSelectedDay];

  // «امروز» همیشه از تاریخ واقعی فعلی گوشی محاسبه می‌شود.
  const today=getJalaliToday();

  for(let i=0;i<start;i++){
    const b=document.createElement('button');
    b.className='empty';
    b.disabled=true;
    box.appendChild(b);
  }

  for(let d=1;d<=days;d++){
    const b=document.createElement('button');
    b.type='button';
    b.textContent=fmt(d);

    // فقط تاریخ انتخاب‌شده یک علامت سبز واضح دارد.
    if(selected[0]===pcYear && selected[1]===pcMonth && selected[2]===d){
      b.classList.add('selected');
      b.setAttribute('aria-selected','true');
    }

    if(today[0]===pcYear && today[1]===pcMonth && today[2]===d){
      b.title='امروز';
      b.dataset.today='true';
    }

    b.onclick=()=>{
      pcSelectedYear=pcYear;
      pcSelectedMonth=pcMonth;
      pcSelectedDay=d;
      pcTempDate=jalaliToGregorian(pcYear,pcMonth,d);
      // بعد از انتخاب، همان تاریخ فوراً سبز می‌ماند تا کاربر «تأیید تاریخ» را بزند.
      renderPersianCalendar();
    };

    box.appendChild(b);
  }
}
function gregorianToJalali(gy,gm,gd){let gdm=[0,31,59,90,120,151,181,212,243,273,304,334],jy=gy>1600?979:-1,gy2=gy>1600?gy-1600:gy-621,days=365*gy2+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];if(gm>2&&((gy%4===0&&gy%100!==0)||gy%400===0))days++;jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function jalaliToGregorian(jy,jm,jd){jy+=1597;let d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-1)*30+6),gy=400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1,md=[0,31,((gy%4===0&&gy%100!==0)||gy%400===0)?29:28,31,30,31,30,31,31,30,31,30,31],gm=0;while(gd>md[gm]){gd-=md[gm];gm++}return new Date(gy,gm-1,gd,12,0,0,0)}

const fmt=n=>new Intl.NumberFormat('fa-IR').format(Math.round(Number(n)||0));
const parseMoney=v=>Math.max(0,Number(String(v??'').replace(/[^0-9.]/g,''))||0);
const clean=n=>Math.max(0,Number(n)||0);

function render(){
  $('invoiceCode').textContent='کود: '+fmt(invoiceCode);
  const tb=$('rows'); tb.innerHTML='';$('empty').style.display=items.length?'none':'block';
  items.forEach((x,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td class="num">${fmt(i+1)}</td>
      <td>${esc(x.name)}</td>
      <td class="num">${fmt(x.qty)}</td>
      <td>${esc(x.unit)}</td>
      <td class="money">${fmt(x.price)}</td>
      <td class="money">${fmt(clean(x.qty)*clean(x.price))}</td>
      <td><button class="edit" onclick="editItem(${i})">ویرایش</button><button class="del" onclick="deleteItem(${i})">حذف</button></td>`;
    tb.appendChild(tr);
  });
  const total=items.reduce((s,x)=>s+(clean(x.qty)*clean(x.price)),0);
  $('total').textContent=fmt(total)+' تومان';
  $('count').textContent=fmt(items.length)+' جنس در فاکتور';
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function resetForm(){
  $('name').value='';$('qty').value=''; $('price').value='';$('unit').value='';
  editIndex=-1; $('addBtn').textContent='＋ افزودن جنس به فاکتور';
}
$('addBtn').onclick=()=>{
  try{
    const name=$('name').value.trim();
    const qty=clean($('qty').value);
    const unit=$('unit').value;
    const price=parseMoney($('price').value);
    if(!name){ alert('لطفاً جنس را وارد کنید.'); $('name').focus(); return; }
    const obj={name,qty,unit,price};
    if(editIndex>=0) items[editIndex]=obj; else items.push(obj);
    resetForm(); render(); saveDraft();
  }catch(err){
    console.error(err); alert('ثبت جنس انجام نشد. لطفاً دوباره تلاش کنید.');
  }
};
window.editItem=i=>{
  const x=items[i]; $('name').value=x.name;$('qty').value=x.qty;$('unit').value=x.unit;$('price').value=fmt(x.price);
  editIndex=i;$('addBtn').textContent='✓ ذخیره ویرایش';window.scrollTo({top:0,behavior:'smooth'});
};
$('notes').addEventListener('input',saveDraft);$('price').addEventListener('input',e=>{const raw=e.target.value.replace(/[^0-9]/g,'');e.target.value=raw?Number(raw).toLocaleString('en-US'):'';});
window.deleteItem=i=>{
  if(confirm('این جنس از فاکتور حذف شود؟')){items.splice(i,1);render();saveDraft();}
};

function saveDraft(){
  localStorage.setItem('invoiceItems',JSON.stringify({
    items, notes:$('notes').value, invoiceCode, invoiceDate: invoiceDate.toISOString()
  }));
}

function loadDraft(){
  try{
    const saved=JSON.parse(localStorage.getItem('invoiceItems')||'[]');
    if(Array.isArray(saved)){ items=saved; $('notes').value=''; invoiceDate=getPhoneToday(); }
    else{
      items=Array.isArray(saved.items)?saved.items:[];
      $('notes').value=saved.notes||'';
      if(/^\\d{3}$/.test(String(saved.invoiceCode||''))){
        invoiceCode=String(saved.invoiceCode);
        localStorage.setItem('currentInvoiceCode',invoiceCode);
      }
      // تاریخ قبلی دیگر از حافظه برگردانده نمی‌شود؛ تاریخ بالای فاکتور همیشه تاریخ فعلی گوشی است.
      invoiceDate = getPhoneToday();
    }
  }catch{
    items=[];$('notes').value='';invoiceDate=getPhoneToday();
  }
  updateDateDisplay();
  render();
}

// دکمه پاک کردن حالا توضیحات را هم پاک می کند
$('clearBtn').onclick=()=>{
  if((items.length || $('notes').value) && confirm('همه جنس‌های این فاکتور و توضیحات پاک شود؟')){
    items=[]; $('notes').value=''; resetForm(); nextInvoiceCode(); saveDraft(); render();
  }
};

$('saveBtn').onclick=()=>{
  if(!items.length){alert('اول حداقل یک جنس اضافه کنید.');return}
  localStorage.setItem('lastInvoice',JSON.stringify({
    invoiceCode, items, notes:$('notes').value,
    total:items.reduce((s,x)=>s+(clean(x.qty)*clean(x.price)),0),
    date:new Date().toISOString(),
    shamsiDate:invoiceDate.toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'})
  }));
  alert('فاکتور با موفقیت ثبت شد ✓');
};

function buildCapture(){
  const total=items.reduce((s,x)=>s+(clean(x.qty)*clean(x.price)),0);
  const notesRaw=$('notes').value.trim();
  const notes=notesRaw ? notesRaw.replace(/\n/g,'<br>') + '<span class="notes-success-sticker">✓</span>' : '<span class="notes-success-sticker">✓</span>';
  // استفاده از تاریخ انتخاب شده
  const footerDate=invoiceDate.toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'});
  
  let html=`<div class="capture-title">فاکتور</div>
  <div class="capture-sub">کود: ${fmt(invoiceCode)}</div>
  <table class="capture-table"><thead><tr><th style="background:#7040c7">شماره</th><th style="background:#ed1670">جنس</th><th style="background:#20a94b">مقدار</th><th style="background:#1769e0">واحد</th><th style="background:#ff8a00">قیمت واحد (تومان)</th><th style="background:#a21caf">جمع مبلغ (تومان)</th></tr></thead><tbody>`;
  items.forEach((x,i)=>html+=`<tr><td>${fmt(i+1)}</td><td>${esc(x.name)}</td><td>${fmt(x.qty)}</td><td>${esc(x.unit)}</td><td>${fmt(x.price)}</td><td>${fmt(clean(x.qty)*clean(x.price))}</td></tr>`);
  html+=`</tbody></table><div class="capture-total">جمع مبلغ کل: ${fmt(total)} تومان</div>
  <div class="capture-footer">
    <table class="capture-footer-table">
      <tr>
        <td class="footer-notes"><span class="footer-label">توضیحات</span>${notes}</td>
        <td class="footer-date"><span class="footer-label">تاریخ ثبت فاکتور</span><span class="footer-date-value">${footerDate}</span></td>
      </tr>
    </table>
  </div>`;
  $('capture').innerHTML=html;
}

// تولید نغمة النجاح (آلارم) 
function playSuccessSound() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    
    const playTone = (freq, startTime, duration) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.5, startTime);
      gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    };
    
    const now = ctx.currentTime;
    playTone(523.25, now, 0.15); // نت اول
    playTone(659.25, now + 0.15, 0.3); // نت دوم
  } catch (err) {
    console.log("Audio API Error", err);
  }
}

$('imageBtn').onclick=async()=>{
  if(!items.length){alert('اول جنس‌ها را اضافه و سپس ثبت کنید.');return}
  try{
    buildCapture();
    const canvas=await html2canvas($('capture'),{scale:2.5,useCORS:true,backgroundColor:'#fff',logging:false});
    const a=document.createElement('a');
    a.download='فاکتور-'+invoiceDate.toLocaleDateString('fa-IR').replaceAll('/','-')+'.png';
    a.href=canvas.toDataURL('image/png',1);
    a.click();

    // تشغيل المنبه الصوتي (آلارم موفقيت)
    playSuccessSound();

    // إظهار الإشعار المرئي
    const success=$('saveSuccess');
    success.classList.add('show');
    success.setAttribute('aria-hidden','false');
    setTimeout(()=>{
      success.classList.remove('show');
      success.setAttribute('aria-hidden','true');
    },1800);
  }catch(err){
    console.error(err);
    alert('ذخیره عکس انجام نشد. لطفاً دوباره تلاش کنید.');
  }
};
loadDraft();

// اگر صفحه باز بماند و روز عوض شود، تاریخ بالای فاکتور نیز خودکار با تاریخ گوشی تازه می‌شود.
// اگر کاربر قبلاً تاریخ دیگری را از تقویم تأیید کرده باشد، تا زمانی که صفحه/فاکتور را دوباره باز نکند همان تاریخ انتخابی حفظ می‌شود.
let lastPhoneDayKey = getPhoneToday().toDateString();
setInterval(()=>{
  const now=getPhoneToday();
  const key=now.toDateString();
  if(key!==lastPhoneDayKey){
    lastPhoneDayKey=key;
    // فقط وقتی تقویم باز نیست، تاریخ پیش‌فرض فاکتور را به امروز منتقل کن.
    if(!$('persianCalendar').classList.contains('show')){
      invoiceDate=now;
      updateDateDisplay();
      saveDraft();
      render();
    }
  }
},60000);
</script>
